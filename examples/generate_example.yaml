# generate_example -- synthetic-data generation pipeline.
#
# Produces a CSV from scratch -- no input file required. Useful for
# building test fixtures, populating dev databases, or seeding a
# downstream system that needs realistic-looking rows without using
# real data.
#
#   decoy validate config examples/generate_example.yaml
#   decoy run examples/generate_example.yaml
#
# Tune `row_count` and the generate_columns to shape the output.
#
# The `orders` table joins to `customers` through a `reference` column, so every
# orders.customer_id is a customer_id that exists. The parent is built first.

version: 2

global_settings:
  seed: 42

sources: {}

tables:
  - name: customers
    row_count: 1000
    generate_columns:
      # Sequence: monotonic integers starting at `start` with step `step`.
      # Useful for primary-key-like ids.
      - name: customer_id
        type: sequence
        start: 10000
        step: 1

      # Faker: realistic-looking strings via the named faker provider.
      - name: first_name
        type: faker
        faker_type: first_name
      - name: last_name
        type: faker
        faker_type: last_name
      - name: email
        type: faker
        faker_type: email
      - name: phone
        type: faker
        faker_type: phone_number
      - name: street_address
        type: faker
        faker_type: street_address
      - name: city
        type: faker
        faker_type: city
      - name: state
        type: faker
        faker_type: state_abbr

      # Categorical: pick from an explicit list, optionally weighted.
      - name: account_tier
        type: categorical
        categories: ["bronze", "silver", "gold", "platinum"]
        weights: [0.50, 0.30, 0.15, 0.05]

  - name: orders
    row_count: 3000
    generate_columns:
      - name: order_id
        type: sequence
        start: 1
        step: 1

      # Reference: copy keys from a column of another generate table.
      - name: customer_id
        type: reference
        reference_table: customers
        reference_column: customer_id

      - name: status
        type: categorical
        categories: ["new", "paid", "shipped", "returned"]
        weights: [0.1, 0.3, 0.5, 0.1]

targets:
  customers:
    type: file
    format: csv
    path: ./customers.csv
  orders:
    type: file
    format: csv
    path: ./orders.csv
