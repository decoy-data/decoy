# QA corpus manifest (schema_version 1). Plan: docs/plans/2026-11-20-qa-beta-program.md.
# Data never enters git: `scripts/qa/corpus/generate.py` builds the generated items and
# `scripts/qa/corpus/fetch.py` downloads the public ones, both into ~/decoy-qa-corpus/<id>/.
# Generated items have no hash (same seed, same bytes). Public items need a recorded license
# from the allow-list in scripts/qa/corpus/manifest.py and a SHA-256 of the exact file.
# `marker_columns` lists table.column for every text column; the generator test keeps it true.

