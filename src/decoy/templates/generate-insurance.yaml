# generate-insurance -- synthetic policyholders, policies and claims.
#
# Builds three linked tables from scratch, with no input file. Every policy belongs to a
# policyholder that exists, and every claim is filed against a policy that exists. All
# values come from faker, so none of it is real policy data.
#
#   decoy run pipeline.yaml
#
# Edit `row_count`, the categories and the weights to match the shape you need.

version: 2

global_settings:
  seed: 42

sources: {}

tables:
  - name: policyholders
    row_count: 1000
    generate_columns:
      - name: policyholder_id
        type: sequence
        start: 100000
        step: 1
      - name: first_name
        type: faker
        faker_type: first_name
      - name: last_name
        type: faker
        faker_type: last_name
      - name: email
        type: faker
        faker_type: email
      - name: state
        type: faker
        faker_type: state_abbr

  - name: policies
    row_count: 1500
    generate_columns:
      - name: policy_id
        type: sequence
        start: 700000
        step: 1
      - name: policyholder_id
        type: reference
        reference_table: policyholders
        reference_column: policyholder_id
      - name: product
        type: categorical
        categories: ["Auto", "Home", "Life", "Renters", "Travel"]
        weights: [0.35, 0.3, 0.15, 0.15, 0.05]
      - name: start_date
        type: faker
        faker_type: date_this_decade
      - name: annual_premium
        type: faker
        faker_type: random_int
        faker_kwargs: {min: 150, max: 4000}

  - name: claims
    row_count: 600
    generate_columns:
      - name: claim_id
        type: sequence
        start: 1
        step: 1
      - name: policy_id
        type: reference
        reference_table: policies
        reference_column: policy_id
      - name: filed_on
        type: faker
        faker_type: date_this_year
      - name: claim_amount
        type: faker
        faker_type: random_int
        faker_kwargs: {min: 100, max: 25000}
      - name: claim_status
        type: categorical
        categories: ["Open", "Paid", "Denied", "Withdrawn"]
        weights: [0.25, 0.55, 0.15, 0.05]

targets:
  policyholders:
    type: file
    format: csv
    path: ./policyholders.csv
  policies:
    type: file
    format: csv
    path: ./policies.csv
  claims:
    type: file
    format: csv
    path: ./claims.csv
