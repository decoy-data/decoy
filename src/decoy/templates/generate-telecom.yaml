# generate-telecom -- synthetic subscribers, lines and call records.
#
# Builds three linked tables from scratch, with no input file. Every line belongs to a
# subscriber that exists, and every call record is made on a line that exists. All values are
# generated, so none of it is real subscriber data.
#
#   decoy run pipeline.yaml
#
# Edit `row_count`, the categories and the weights to match the shape you need.

version: 2

global_settings:
  seed: 42

sources: {}

tables:
  - name: subscribers
    row_count: 1000
    generate_columns:
      - name: subscriber_id
        type: sequence
        start: 100000
        step: 1
      - name: first_name
        type: faker
        faker_type: first_name
      - name: last_name
        type: faker
        faker_type: last_name
      - name: email
        type: faker
        faker_type: email
      - name: city
        type: faker
        faker_type: city

  - name: lines
    row_count: 1400
    generate_columns:
      - name: line_id
        type: sequence
        start: 1
        step: 1
      - name: subscriber_id
        type: reference
        reference_table: subscribers
        reference_column: subscriber_id
      - name: phone_number
        type: faker
        faker_type: phone_number
      - name: plan
        type: categorical
        categories: ["Prepaid", "Basic", "Unlimited", "Family"]
        weights: [0.2, 0.3, 0.35, 0.15]
      - name: activated_on
        type: faker
        faker_type: date_this_decade

  - name: call_records
    row_count: 10000
    generate_columns:
      - name: call_id
        type: sequence
        start: 1
        step: 1
      - name: line_id
        type: reference
        reference_table: lines
        reference_column: line_id
      - name: started_at
        type: faker
        faker_type: date_time_this_year
      - name: duration_seconds
        type: faker
        faker_type: random_int
        faker_kwargs: {min: 5, max: 3600}
      - name: call_type
        type: categorical
        categories: ["Voice", "SMS", "Data"]
        weights: [0.4, 0.3, 0.3]

targets:
  subscribers:
    type: file
    format: csv
    path: ./subscribers.csv
  lines:
    type: file
    format: csv
    path: ./lines.csv
  call_records:
    type: file
    format: csv
    path: ./call_records.csv
